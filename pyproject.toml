[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fluxsheet"
dynamic = ["version"]  # from src/fluxsheet/__init__.py
description = "An open, friendly chemical process simulator: flowsheets, rigorous thermodynamics, readable files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fluxsheet contributors" }]
keywords = ["chemical engineering", "process simulation", "flowsheet", "thermodynamics", "VLE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "thermo>=0.4",
  "pydantic>=2.6",
  "scipy>=1.10",  # reactor solvers, parameter fitting; also a dependency of thermo
  "defusedxml>=0.7",  # safe parsing of downloaded ThermoML files
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
fluxsheet = "fluxsheet.cli:main"

[project.urls]
Homepage = "https://github.com/almi2000/fluxsheet"
Changelog = "https://github.com/almi2000/fluxsheet/blob/main/CHANGELOG.md"
Issues = "https://github.com/almi2000/fluxsheet/issues"

[tool.hatch.version]
path = "src/fluxsheet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxsheet"]

# hatch_build.py bundles the built editor (web/dist) and the examples into the wheel, so
# `pip install fluxsheet[server]` and `fluxsheet serve` give the full app.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/fluxsheet", "web/dist", "examples", "tests", "hatch_build.py", "README.md",
           "LICENSE", "CHANGELOG.md"]
artifacts = ["web/dist"]  # git-ignored build output, but part of the source distribution

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
