[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fluxsheet"
version = "0.1.0"
description = "An open, friendly chemical process simulator: flowsheets, rigorous thermodynamics, readable files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fluxsheet contributors" }]
keywords = ["chemical engineering", "process simulation", "flowsheet", "thermodynamics", "VLE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "thermo>=0.4",
  "pydantic>=2.6",
  "scipy>=1.10",  # reactor solvers, parameter fitting; also a dependency of thermo
  "defusedxml>=0.7",  # safe parsing of downloaded ThermoML files
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
fluxsheet = "fluxsheet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxsheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
