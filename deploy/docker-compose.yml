# Online demo behind Traefik (see the server's /opt/traefik). Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
name: fluxsheet
services:
  fluxsheet:
    build: ..
    container_name: fluxsheet
    restart: unless-stopped
    environment:
      FLUXSHEET_DEMO: "1"
      FLUXSHEET_MAX_SECONDS: "60"
    ports:
      - "127.0.0.1:8102:8000"     # for checks on the server only
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.fluxsheet.rule=Host(`fluxsheet.boxingenieur.org`)
      - traefik.http.routers.fluxsheet.entrypoints=websecure
      - traefik.http.routers.fluxsheet.tls.certresolver=le
      - traefik.http.services.fluxsheet.loadbalancer.server.port=8000
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 0.9
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  proxy:
    external: true
