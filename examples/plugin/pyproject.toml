[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxsheet-example-plugin"
version = "0.2.0"
description = "Example Fluxsheet plug-in: a dew-point cooler, the regular-solution model and a naphtha cut"
requires-python = ">=3.11"
dependencies = ["fluxsheet"]

[project.entry-points."fluxsheet.units"]
example_units = "fluxsheet_example_plugin.units"

[project.entry-points."fluxsheet.property_methods"]
regular_solution = "fluxsheet_example_plugin.thermo:REGULAR_SOLUTION"

[project.entry-points."fluxsheet.components"]
naphtha = "fluxsheet_example_plugin.compounds:COMPOUNDS"

[project.entry-points."fluxsheet.dynamic_models"]
cooler_lag = "fluxsheet_example_plugin.dynamics:MODELS"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxsheet_example_plugin"]
